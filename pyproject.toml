[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bunq-cli"
version = "0.1.0"
description = "Command-line interface for the Bunq API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["bunq", "banking", "cli", "payments", "finance"]
authors = [
    { name = "Koert van der Veer", email = "koert@ondergetekende.nl" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "click>=8.1",
    "bunq-sdk>=1.28",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/ondergetekende/bunq-cli"
Repository = "https://github.com/ondergetekende/bunq-cli"
Issues = "https://github.com/ondergetekende/bunq-cli/issues"

[project.scripts]
bunq = "bunq_cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]
